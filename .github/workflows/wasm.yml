name: Wasm

# Builds tree-sitter-cuda.wasm for CodeBoard, which loads it with the runtime in
# @vscode/tree-sitter-wasm. The CLI and emsdk versions must match that runtime
# (0.3.1 ships web-tree-sitter 0.25.1, ABI 15, emsdk 4.0.1); bump all three together.
# Every run packs npm/ (only the wasm and the queries) into a tarball. A push to master whose
# npm/package.json version has no `v<version>` tag yet creates that tag and its GitHub Release with
# the wasm and the tarball; CodeBoard installs the tarball by its URL. Nothing is published to the
# npm registry. So a release is just a version bump merged into master.

on:
  push:
    branches: ["**"]
    paths:
      - grammar.js
      - src/**
      - test/**
      - package.json
      - package-lock.json
      - npm/**
      - script/check-wasm.mjs
      - .github/workflows/wasm.yml
  pull_request:
  workflow_dispatch:

env:
  TREE_SITTER_CLI: 0.25.1
  EMSDK: 4.0.1
  VSCODE_TREE_SITTER_WASM: 0.3.1

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  # never cancel a master run halfway through creating a release
  cancel-in-progress: ${{github.ref != 'refs/heads/master'}}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{env.EMSDK}}
      - name: Install grammar dependencies and the tree-sitter CLI
        run: |
          npm ci --ignore-scripts
          npm i --no-save --ignore-scripts "@vscode/tree-sitter-wasm@$VSCODE_TREE_SITTER_WASM"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/tree-sitter/tree-sitter/releases/download/v$TREE_SITTER_CLI/tree-sitter-linux-x64.gz" | gunzip > "$RUNNER_TEMP/bin/tree-sitter"
          chmod +x "$RUNNER_TEMP/bin/tree-sitter"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: tree-sitter --version
      # src/ is committed by upstream's newer CLI; regenerate so the parser's ABI and
      # headers are exactly what this CLI and runtime expect.
      - name: Generate
        run: tree-sitter generate
      - name: Corpus tests
        run: tree-sitter test
      - name: Build wasm
        run: tree-sitter build --wasm -o tree-sitter-cuda.wasm
      - name: Load with CodeBoard's runtime
        run: node script/check-wasm.mjs tree-sitter-cuda.wasm
      - run: sha256sum tree-sitter-cuda.wasm | tee tree-sitter-cuda.wasm.sha256
      - name: Pack the wasm package
        run: |
          cp tree-sitter-cuda.wasm LICENSE npm/
          mkdir -p npm/queries && cp queries/*.scm npm/queries/
          npm pack ./npm
      - uses: actions/upload-artifact@v7
        with:
          name: tree-sitter-cuda-wasm
          path: |
            tree-sitter-cuda.wasm*
            yhnocoder-tree-sitter-cuda-*.tgz
      - name: Release a new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          TAG="v$(node -p 'require("./npm/package.json").version')"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to release"; exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "tree-sitter-cuda.wasm built with tree-sitter CLI $TREE_SITTER_CLI (ABI 15) and emsdk $EMSDK, for @vscode/tree-sitter-wasm $VSCODE_TREE_SITTER_WASM." \
            tree-sitter-cuda.wasm tree-sitter-cuda.wasm.sha256 yhnocoder-tree-sitter-cuda-*.tgz
